<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Live Translator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #888;
      margin-bottom: 32px;
    }

    .lang-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    select {
      background: #1e1e1e;
      color: #f0f0f0;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 16px;
      cursor: pointer;
      outline: none;
    }

    .arrow {
      font-size: 20px;
      color: #555;
    }

    .result-box {
      width: 100%;
      max-width: 440px;
      min-height: 120px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 20px;
      font-size: 22px;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 48px;
      color: #f0f0f0;
      word-break: break-word;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-box.placeholder {
      color: #444;
      font-size: 16px;
    }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #talkBtn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #333;
      background: #1e1e1e;
      color: #f0f0f0;
      font-size: 36px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #talkBtn:active,
    #talkBtn.recording {
      background: #c0392b;
      border-color: #e74c3c;
      transform: scale(0.96);
    }

    #talkBtn.loading {
      background: #1a3a1a;
      border-color: #2ecc71;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #status {
      font-size: 14px;
      color: #555;
      height: 20px;
    }

    #ttsBtn {
      margin-top: 8px;
      background: none;
      border: 1px solid #333;
      color: #888;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      display: none;
    }

    #ttsBtn:hover { border-color: #555; color: #ccc; }
  </style>
</head>
<body>
  <h1>LIVE TRANSLATOR</h1>

  <div class="lang-row">
    <select id="fromLang">
      <option value="Russian">RU</option>
      <option value="English">EN</option>
      <option value="Spanish">ES</option>
      <option value="French">FR</option>
      <option value="German">DE</option>
      <option value="Chinese">ZH</option>
      <option value="Japanese">JA</option>
    </select>
    <span class="arrow">→</span>
    <select id="toLang">
      <option value="English">EN</option>
      <option value="Russian">RU</option>
      <option value="Spanish">ES</option>
      <option value="French">FR</option>
      <option value="German">DE</option>
      <option value="Chinese">ZH</option>
      <option value="Japanese">JA</option>
    </select>
  </div>

  <div id="resultBox" class="result-box placeholder">
    Hold the button and speak
  </div>

  <div class="btn-wrap">
    <button id="talkBtn" title="Hold to talk">🎤</button>
    <div id="status">Ready</div>
    <button id="ttsBtn">🔊 Speak again</button>
  </div>

  <script>
    const talkBtn = document.getElementById('talkBtn');
    const resultBox = document.getElementById('resultBox');
    const statusEl = document.getElementById('status');
    const ttsBtn = document.getElementById('ttsBtn');
    const fromLang = document.getElementById('fromLang');
    const toLang = document.getElementById('toLang');

    let mediaRecorder = null;
    let chunks = [];
    let lastTranslation = '';

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(chunks, { type: 'audio/webm' });
          await sendAudio(blob);
        };

        mediaRecorder.start();
        talkBtn.classList.add('recording');
        setStatus('Recording...');
      } catch (err) {
        setStatus('Mic access denied');
        console.error(err);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        talkBtn.classList.remove('recording');
        talkBtn.classList.add('loading');
        talkBtn.textContent = '⏳';
        setStatus('Translating...');
      }
    }

    async function sendAudio(blob) {
      const formData = new FormData();
      formData.append('audio', blob, 'audio.webm');
      formData.append('from', fromLang.value);
      formData.append('to', toLang.value);

      try {
        const res = await fetch('/api/translate', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.translation) {
          lastTranslation = data.translation;
          resultBox.textContent = data.translation;
          resultBox.classList.remove('placeholder');
          ttsBtn.style.display = 'block';
          speak(data.translation);
          setStatus('Done');
        } else {
          setStatus('Error: ' + (data.error || 'unknown'));
        }
      } catch (err) {
        setStatus('Network error');
        console.error(err);
      } finally {
        talkBtn.classList.remove('loading');
        talkBtn.textContent = '🎤';
      }
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = toLang.value === 'Russian' ? 'ru-RU' : toLang.value === 'Chinese' ? 'zh-CN' : toLang.value === 'Japanese' ? 'ja-JP' : 'en-US';
      window.speechSynthesis.speak(utt);
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    // Mouse events
    talkBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startRecording(); });
    talkBtn.addEventListener('mouseup', stopRecording);
    talkBtn.addEventListener('mouseleave', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
    });

    // Touch events (mobile)
    talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
    talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });

    ttsBtn.addEventListener('click', () => { if (lastTranslation) speak(lastTranslation); });
  </script>
</body>
</html>
